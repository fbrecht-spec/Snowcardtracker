<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Flo's Tracker">
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg">
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
    <script>
      // Gewähltes Erscheinungsbild vor dem ersten Zeichnen setzen (kein Aufblitzen)
      try { var t = localStorage.getItem('snowcard_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <title>Flo's Tracker - Snowcard Tirol</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
